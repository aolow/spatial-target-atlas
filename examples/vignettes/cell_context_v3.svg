<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<style>
text{font-family:system-ui,-apple-system,sans-serif;fill:#1f2937}
.title{font-size:30px;font-weight:760}.sub{font-size:13px;fill:#64748b}
.h2{font-size:18px;font-weight:720}.small{font-size:11px;fill:#64748b}
.panel{fill:#fbfcfe;stroke:#d8dee4;stroke-width:1.4}
.scene{fill:#fff;stroke:#e5e7eb;stroke-width:1.2}
.label{font-size:10px;fill:#64748b}
.badge{font-size:9px;font-weight:650}
</style>
<rect width="1400" height="720" fill="#fff"/>
<text x="42" y="45" class="title">Cell-context redesign v3</text>
<text x="42" y="70" class="sub">Illustrative design only. Biology is primary; source signal sits behind/around tissue compartments.</text>

<g transform="translate(42,105)">
  <rect class="panel" width="315" height="560" rx="16"/>
  <text x="18" y="34" class="h2">Epithelial sheet</text>
  <text x="18" y="56" class="sub">lumen + polarized cells + basement membrane</text>
  <rect x="18" y="78" width="279" height="250" rx="14" fill="#fff" stroke="#e5e7eb"/>
  <rect x="26" y="86" width="263" height="234" rx="18" fill="#00b7d8" fill-opacity=".18"/>
  <ellipse cx="157" cy="205" rx="112" ry="78" fill="#facc15" fill-opacity=".12"/>
  <rect x="30" y="90" width="255" height="226" rx="17" fill="none" stroke="#111827" stroke-width="4" stroke-opacity=".55"/>
  <path d="M36 120 Q82 102 125 116 T212 114 T278 119" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <text x="42" y="109" class="label">lumen</text>
  <g fill="#fff" stroke="#64748b" stroke-width="1.2">
    <path d="M45 137 L76 137 L74 270 Q60 280 47 270Z"/><path d="M77 140 L108 140 L106 272 Q92 282 79 272Z"/>
    <path d="M109 136 L140 136 L138 270 Q124 280 111 270Z"/><path d="M141 141 L172 141 L170 273 Q156 283 143 273Z"/>
    <path d="M173 137 L204 137 L202 270 Q188 280 175 270Z"/><path d="M205 140 L236 140 L234 272 Q220 282 207 272Z"/>
    <path d="M237 136 L268 136 L266 270 Q252 280 239 270Z"/>
  </g>
  <g fill="#cbd5e1" stroke="#64748b" stroke-width=".8">
    <ellipse cx="60" cy="210" rx="7" ry="10"/><ellipse cx="92" cy="212" rx="7" ry="10"/><ellipse cx="124" cy="209" rx="7" ry="10"/>
    <ellipse cx="156" cy="213" rx="7" ry="10"/><ellipse cx="188" cy="210" rx="7" ry="10"/><ellipse cx="220" cy="212" rx="7" ry="10"/><ellipse cx="252" cy="209" rx="7" ry="10"/>
  </g>
  <path d="M40 286 C88 278 130 292 169 285 C209 278 247 292 276 285" fill="none" stroke="#a78bfa" stroke-width="4"/>
  <text x="164" y="304" class="label">basement membrane</text>
  <text x="18" y="365" class="small">Source overlay</text>
  <rect x="18" y="382" width="78" height="24" rx="12" fill="#e0f7fb" stroke="#00b7d8"/><text x="35" y="398" class="badge">HPA protein 62%</text>
  <rect x="104" y="382" width="78" height="24" rx="12" fill="#fff7cc" stroke="#facc15"/><text x="121" y="398" class="badge">Spatial RNA 34%</text>
  <rect x="190" y="382" width="78" height="24" rx="12" fill="#f8fafc" stroke="#111827"/><text x="207" y="398" class="badge">HuBMAP protein 74%</text>
  <text x="18" y="445" class="small">Signal does not recolor the cells themselves.</text>
  <text x="18" y="465" class="small">The compartment remains visually legible.</text>
</g>

<g transform="translate(375,105)">
  <rect class="panel" width="315" height="560" rx="16"/>
  <text x="18" y="34" class="h2">Endothelial vessel</text>
  <text x="18" y="56" class="sub">vascular lumen + endothelial lining</text>
  <rect x="18" y="78" width="279" height="250" rx="14" fill="#fff" stroke="#e5e7eb"/>
  <rect x="26" y="86" width="263" height="234" rx="18" fill="#00b7d8" fill-opacity=".12"/>
  <ellipse cx="157" cy="205" rx="112" ry="78" fill="#facc15" fill-opacity=".08"/>
  <ellipse cx="157" cy="202" rx="116" ry="62" fill="#eff6ff" stroke="#94a3b8"/>
  <ellipse cx="157" cy="202" rx="94" ry="43" fill="#fff" stroke="#cbd5e1"/>
  <g stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M58 174 C84 150 112 151 137 163 M148 160 C175 151 208 158 232 181"/>
    <path d="M58 230 C84 254 112 253 137 241 M148 244 C175 253 208 246 232 223"/>
  </g>
  <g fill="#fecaca" stroke="#ef4444">
    <ellipse cx="113" cy="204" rx="10" ry="5"/><ellipse cx="158" cy="192" rx="10" ry="5"/><ellipse cx="197" cy="214" rx="10" ry="5"/>
  </g>
  <g fill="#bfdbfe"><circle cx="87" cy="165" r="4"/><circle cx="164" cy="157" r="4"/><circle cx="214" cy="177" r="4"/></g>
  <text x="111" y="270" class="label">vascular lumen</text>
  <text x="18" y="365" class="small">Compartment identity remains obvious</text>
  <rect x="18" y="382" width="78" height="24" rx="12" fill="#e0f7fb" stroke="#00b7d8"/><text x="35" y="398" class="badge">HPA protein 40%</text>
  <text x="18" y="445" class="small">Better for endothelial specificity than a</text>
  <text x="18" y="465" class="small">single generic elongated “cell” icon.</text>
</g>

<g transform="translate(708,105)">
  <rect class="panel" width="315" height="560" rx="16"/>
  <text x="18" y="34" class="h2">Fibroblast / ECM</text>
  <text x="18" y="56" class="sub">stromal cells embedded in collagen matrix</text>
  <rect x="18" y="78" width="279" height="250" rx="14" fill="#fff" stroke="#e5e7eb"/>
  <rect x="26" y="86" width="263" height="234" rx="18" fill="#00b7d8" fill-opacity=".11"/>
  <ellipse cx="157" cy="205" rx="112" ry="78" fill="#facc15" fill-opacity=".07"/>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M35 126 C82 103 120 145 166 119 S236 111 279 137" stroke="#d6b98c"/>
    <path d="M30 171 C80 148 119 189 165 163 S236 155 283 182" stroke="#c4a77d"/>
    <path d="M35 224 C83 200 128 245 174 215 S242 209 280 233" stroke="#d6b98c"/>
    <path d="M39 278 C89 254 130 294 178 270 S242 260 278 286" stroke="#c4a77d"/>
  </g>
  <g fill="#fff" stroke="#64748b">
    <path d="M60 174 C77 163 82 146 96 164 C110 146 116 163 133 174 C116 185 110 202 96 184 C82 202 77 185 60 174Z"/>
    <path d="M152 232 C169 221 174 204 188 222 C202 204 208 221 225 232 C208 243 202 260 188 242 C174 260 169 243 152 232Z"/>
  </g>
  <g fill="#fed7aa" stroke="#ea580c"><ellipse cx="96" cy="174" rx="8" ry="5"/><ellipse cx="188" cy="232" rx="8" ry="5"/></g>
  <text x="35" y="306" class="label">collagen-rich ECM</text>
  <rect x="18" y="382" width="78" height="24" rx="12" fill="#e0f7fb" stroke="#00b7d8"/><text x="35" y="398" class="badge">HPA protein 50%</text>
  <rect x="104" y="382" width="78" height="24" rx="12" fill="#fff7cc" stroke="#facc15"/><text x="121" y="398" class="badge">Spatial RNA 20%</text>
  <text x="18" y="445" class="small">The matrix is part of the visual context,</text>
  <text x="18" y="465" class="small">rather than treating fibroblasts in isolation.</text>
</g>

<g transform="translate(1041,105)">
  <rect class="panel" width="315" height="560" rx="16"/>
  <text x="18" y="34" class="h2">Immune field</text>
  <text x="18" y="56" class="sub">lymphocytes + macrophage in tissue context</text>
  <rect x="18" y="78" width="279" height="250" rx="14" fill="#fff" stroke="#e5e7eb"/>
  <ellipse cx="157" cy="205" rx="112" ry="78" fill="#facc15" fill-opacity=".14"/>
  <rect x="26" y="86" width="263" height="234" rx="18" fill="none" stroke="#111827" stroke-width="5" stroke-opacity=".65"/>
  <path d="M34 295 C80 270 120 307 166 286 S239 278 281 299" fill="none" stroke="#d1d5db" stroke-width="3"/>
  <g fill="#fff" stroke="#64748b">
    <circle cx="88" cy="159" r="16"/><circle cx="126" cy="241" r="16"/><circle cx="229" cy="159" r="16"/><circle cx="226" cy="253" r="16"/>
  </g>
  <g fill="#bfdbfe" stroke="#2563eb">
    <circle cx="88" cy="159" r="10"/><circle cx="126" cy="241" r="10"/><circle cx="229" cy="159" r="10"/><circle cx="226" cy="253" r="10"/>
  </g>
  <path d="M149 211 C144 193 158 181 176 186 C192 181 206 196 201 213 C206 229 191 241 176 236 C161 242 146 228 149 211Z" fill="#fff" stroke="#64748b"/>
  <path d="M163 209 C164 196 183 194 187 207 C190 220 178 228 168 223 C164 220 162 215 163 209Z" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="35" y="111" class="label">mixed immune microenvironment</text>
  <rect x="18" y="382" width="78" height="24" rx="12" fill="#fff7cc" stroke="#facc15"/><text x="35" y="398" class="badge">Spatial RNA 60%</text>
  <rect x="104" y="382" width="78" height="24" rx="12" fill="#f8fafc" stroke="#111827"/><text x="121" y="398" class="badge">HuBMAP protein 80%</text>
  <text x="18" y="445" class="small">Different immune morphologies can coexist</text>
  <text x="18" y="465" class="small">without pretending “immune” is one cell shape.</text>
</g>
</svg>