<rect width="1400" height="900" fill="#fff"/>
<text x="42" y="45" class="title">Spatial Target Atlas v2</text>
<text x="42" y="70" class="sub">Illustrative design only. Opacity demonstrates source-local strength, not LUAD scientific results.</text>

<g transform="translate(42,92)">
<rect class="panel" width="1316" height="66" rx="14"/>
<rect x="20" y="16" width="18" height="18" rx="4" fill="#00b7d8"/><text x="46" y="30">C · HPA protein</text>
<rect x="190" y="16" width="18" height="18" rx="4" fill="#d946ef"/><text x="216" y="30">M · ProteomicsDB</text>
<rect x="410" y="16" width="18" height="18" rx="4" fill="#facc15"/><text x="436" y="30">Y · spatial RNA</text>
<rect x="585" y="16" width="18" height="18" rx="4" fill="#fff" stroke="#111827" stroke-width="4"/><text x="611" y="30">K · spatial protein</text>
<text x="820" y="30" class="small">Hue = source · opacity = strength within source · composite uses multiply blending</text>
<text x="20" y="52" class="small">Four source-specific small maps make every mixed composite auditable.</text>
</g>

