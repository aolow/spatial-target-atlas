<g transform="translate(22,560)">
<rect x="0" y="0" width="476" height="78" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
<text x="14" y="24" class="small" font-weight="700">Disease context stays separate</text>
<text x="14" y="45" class="small">PDC tumor-vs-adjacent is a badge, not another body-map pigment.</text>
<text x="14" y="63" class="small">This keeps normal-tissue spatial support and cancer enrichment conceptually distinct.</text>
</g>
