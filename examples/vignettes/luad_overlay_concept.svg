<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <style>
    text{font-family:system-ui,-apple-system,sans-serif;fill:#1f2937}
    .title{font-size:26px;font-weight:750}.sub{font-size:13px;fill:#64748b}
    .target{font-size:20px;font-weight:750}.label{font-size:12px}
    .panel{fill:#fbfcfe;stroke:#d8dee4;stroke-width:1.5}
    .body{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    .small{font-size:10px;fill:#64748b}
  </style>
  <rect width="1200" height="640" fill="#fff"/>
  <text x="40" y="42" class="title">Spatial Target Atlas overlay concept</text>
  <text x="40" y="66" class="sub">Illustrative design only. Colors below are not LUAD scientific results.</text>

  <g transform="translate(40,92)">
    <rect class="panel" width="1120" height="62" rx="14"/>
    <g transform="translate(18,15)">
      <rect width="18" height="18" rx="4" fill="#00b7d8"/><text x="26" y="14" class="label"><tspan font-weight="700">C</tspan> HPA protein</text>
      <rect x="160" width="18" height="18" rx="4" fill="#d946ef"/><text x="186" y="14" class="label"><tspan font-weight="700">M</tspan> ProteomicsDB</text>
      <rect x="350" width="18" height="18" rx="4" fill="#facc15"/><text x="376" y="14" class="label"><tspan font-weight="700">Y</tspan> spatial RNA</text>
      <rect x="520" width="18" height="18" rx="4" fill="#fff" stroke="#111827" stroke-width="4"/><text x="546" y="14" class="label"><tspan font-weight="700">K</tspan> spatial protein outline</text>
      <rect x="760" width="18" height="18" rx="4" fill="#2563eb"/><text x="786" y="14" class="label">C + M = mixed source support</text>
    </g>
    <text x="18" y="50" class="small">PDC tumor-versus-adjacent is shown separately and never mixed into the body palette.</text>
  </g>

  <g transform="translate(40,176)">
    <rect class="panel" width="350" height="420" rx="16"/>
    <text x="20" y="34" class="target">EPCAM</text>
    <text x="20" y="54" class="sub">example visual grammar</text>
    <g transform="translate(20,74)">
      <circle class="body" cx="90" cy="32" r="28"/><rect class="body" x="61" y="62" width="58" height="150" rx="27"/>
      <rect class="body" x="30" y="72" width="30" height="145" rx="15"/><rect class="body" x="120" y="72" width="30" height="145" rx="15"/>
      <rect class="body" x="64" y="198" width="24" height="120" rx="12"/><rect class="body" x="94" y="198" width="24" height="120" rx="12"/>
      <ellipse cx="72" cy="112" rx="17" ry="28" fill="#2563eb" stroke="#111827" stroke-width="4"/>
      <ellipse cx="108" cy="112" rx="17" ry="28" fill="#2563eb" stroke="#111827" stroke-width="4"/>
      <path d="M90,148 C68,130 74,117 90,130 C106,117 112,130 90,148Z" fill="#00b7d8"/>
      <ellipse cx="110" cy="178" rx="24" ry="14" fill="#22c55e"/>
      <text x="171" y="110" class="label">lung: C+M + K</text><text x="171" y="145" class="label">heart: C</text><text x="171" y="177" class="label">liver: C+Y</text>
    </g>
    <g transform="translate(20,318)">
      <text class="label" font-weight="700">Cell contexts</text>
      <rect x="0" y="14" width="92" height="28" rx="14" fill="#22c55e" stroke="#111827" stroke-width="3"/><text x="12" y="33" class="small">epithelial</text>
      <rect x="102" y="14" width="76" height="28" rx="14" fill="#facc15"/><text x="119" y="33" class="small">immune</text>
      <rect x="188" y="14" width="95" height="28" rx="14" fill="#00b7d8"/><text x="203" y="33" class="small">endothelial</text>
      <rect x="0" y="58" width="286" height="12" rx="6" fill="#eef2f7"/><rect x="0" y="58" width="235" height="12" rx="6" fill="url(#g1)"/>
      <text x="0" y="88" class="small">dataset intensity: within-dataset scale only</text>
    </g>
  </g>

  <g transform="translate(425,176)">
    <rect class="panel" width="350" height="420" rx="16"/>
    <text x="20" y="34" class="target">CEACAM5</text>
    <text x="20" y="54" class="sub">example visual grammar</text>
    <g transform="translate(20,74)">
      <circle class="body" cx="90" cy="32" r="28"/><rect class="body" x="61" y="62" width="58" height="150" rx="27"/>
      <rect class="body" x="30" y="72" width="30" height="145" rx="15"/><rect class="body" x="120" y="72" width="30" height="145" rx="15"/>
      <rect class="body" x="64" y="198" width="24" height="120" rx="12"/><rect class="body" x="94" y="198" width="24" height="120" rx="12"/>
      <ellipse cx="72" cy="112" rx="17" ry="28" fill="#ef4444" stroke="#111827" stroke-width="4"/>
      <ellipse cx="108" cy="112" rx="17" ry="28" fill="#ef4444" stroke="#111827" stroke-width="4"/>
      <rect x="65" y="195" width="50" height="30" rx="12" fill="#2563eb"/>
      <text x="171" y="110" class="label">lung: M+Y + K</text><text x="171" y="203" class="label">colon: C+M</text>
    </g>
    <g transform="translate(20,318)">
      <text class="label" font-weight="700">Subcellular</text>
      <rect x="0" y="14" width="90" height="32" rx="8" fill="#dbeafe" stroke="#60a5fa"/><text x="17" y="35" class="small">membrane</text>
      <rect x="100" y="14" width="90" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="115" y="35" class="small">cytoplasm</text>
      <rect x="200" y="14" width="86" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="221" y="35" class="small">nucleus</text>
      <rect x="0" y="58" width="286" height="12" rx="6" fill="#eef2f7"/><rect x="0" y="58" width="170" height="12" rx="6" fill="url(#g1)"/>
      <text x="0" y="88" class="small">source value remains visible in HTML view</text>
    </g>
  </g>

  <g transform="translate(810,176)">
    <rect class="panel" width="350" height="420" rx="16"/>
    <text x="20" y="34" class="target">MSLN</text>
    <text x="20" y="54" class="sub">example visual grammar</text>
    <g transform="translate(20,74)">
      <circle class="body" cx="90" cy="32" r="28"/><rect class="body" x="61" y="62" width="58" height="150" rx="27"/>
      <rect class="body" x="30" y="72" width="30" height="145" rx="15"/><rect class="body" x="120" y="72" width="30" height="145" rx="15"/>
      <rect class="body" x="64" y="198" width="24" height="120" rx="12"/><rect class="body" x="94" y="198" width="24" height="120" rx="12"/>
      <ellipse cx="72" cy="112" rx="17" ry="28" fill="#22c55e"/>
      <ellipse cx="108" cy="112" rx="17" ry="28" fill="#22c55e"/>
      <ellipse cx="110" cy="178" rx="24" ry="14" fill="#d946ef"/>
      <ellipse cx="66" cy="184" rx="10" ry="15" fill="#facc15"/>
      <text x="171" y="110" class="label">lung: C+Y</text><text x="171" y="174" class="label">liver: M</text><text x="171" y="200" class="label">spleen: Y</text>
    </g>
    <g transform="translate(20,318)">
      <text class="label" font-weight="700">Disease context</text>
      <rect x="0" y="14" width="286" height="48" rx="8" fill="#fff1f2" stroke="#fb7185"/>
      <text x="12" y="34" class="small" font-weight="700">PDC tumor vs adjacent</text><text x="12" y="51" class="small">separate badge, not a body-map color</text>
      <rect x="0" y="76" width="286" height="12" rx="6" fill="#eef2f7"/><rect x="0" y="76" width="95" height="12" rx="6" fill="url(#g1)"/>
    </g>
  </g>
  <defs><linearGradient id="g1" x1="0" x2="1"><stop stop-color="#00b7d8"/><stop offset="1" stop-color="#d946ef"/></linearGradient></defs>
</svg>