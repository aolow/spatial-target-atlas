    <text x="205" y="40" class="small">ring = normal / reference context only</text>
  </g>
</g>

<g transform="translate(744,94)">
  <rect class="panel" x="0" y="0" width="928" height="840" rx="18"/>
  <text x="24" y="38" class="h2">Tissue context split</text>
  <text x="24" y="60" class="sub">Reference biology and tumor biology are no longer overlaid into one synthetic tissue scene.</text>

  <g transform="translate(24,88)">
    <rect x="0" y="0" width="425" height="590" rx="16" fill="#fcfcfd" stroke="#d8dee4"/>
    <text x="18" y="30" class="h2">Normal / reference tissue</text>
    <text x="18" y="50" class="small">healthy/reference-oriented spatial sources</text>
    <g transform="translate(14,72)">
      <rect x="0" y="0" width="397" height="410" rx="15" fill="#fff" stroke="#e5e7eb"/>
      <path d="M12 72 C82 48 144 83 211 57 S333 51 386 82" fill="none" stroke="#dbcdb7" stroke-width="3"/>
