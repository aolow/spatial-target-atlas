      <path d="M26 344 C89 352 164 351 235 343" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <ellipse cx="310" cy="100" rx="69" ry="30" fill="#f8fbff" stroke="#64748b" stroke-width="6"/>
      <ellipse cx="310" cy="100" rx="49" ry="18" fill="#fff" stroke="#cbd5e1"/>
      <ellipse cx="288" cy="97" rx="9" ry="4" fill="#fecaca" stroke="#ef4444"/><ellipse cx="322" cy="105" rx="9" ry="4" fill="#fecaca" stroke="#ef4444"/>
      <g fill="#fff" stroke="#64748b"><circle cx="276" cy="242" r="11"/><circle cx="333" cy="276" r="11"/><circle cx="366" cy="224" r="11"/></g>
      <g fill="#bfdbfe" stroke="#2563eb"><circle cx="276" cy="242" r="7"/><circle cx="333" cy="276" r="7"/><circle cx="366" cy="224" r="7"/></g>
      <text x="30" y="199" class="scene-label">organized epithelium</text><text x="267" y="64" class="scene-label">vessel</text><text x="290" y="218" class="scene-label">immune cells</text><text x="28" y="392" class="scene-label">stromal ECM</text>
    </g>
    <text x="18" y="518" class="small">HPA / HuBMAP / normal CELLxGENE remain on this side.</text>
  </g>

  <g transform="translate(475,88)">
    <rect x="0" y="0" width="425" height="590" rx="16" fill="#fffafb" stroke="#eadfe3"/>
    <text x="18" y="30" class="h2">Tumor tissue</text>
    <text x="18" y="50" class="small">tumor-resolved spatial evidence only</text>
    <g transform="translate(14,72)">
      <rect x="0" y="0" width="397" height="410" rx="15" fill="#fff" stroke="#eadfe3"/>
      <path d="M12 73 C72 25 141 101 210 55 S327 39 385 96" fill="none" stroke="#c9a982" stroke-width="4"/>
      <path d="M12 126 C79 71 145 153 216 95 S337 75 387 137" fill="none" stroke="#b9956d" stroke-width="4"/>
      <g fill="#fff" fill-opacity=".94" stroke="#7f1d1d">
        <path d="M33 182 C43 140 92 133 121 164 C153 137 195 157 194 196 C183 229 144 239 112 219 C74 239 40 222 33 182Z"/>
        <path d="M77 278 C87 234 139 229 170 258 C199 237 237 254 240 288 C226 324 185 329 153 309 C119 329 85 316 77 278Z"/>
