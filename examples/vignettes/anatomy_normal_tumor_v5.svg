.organ{fill:#eef2f7;stroke:#64748b;stroke-width:1.2}.ghost{opacity:.34}
</style>
<rect width="1700" height="980" fill="#fff"/>
<text x="40" y="44" class="title">Spatial Target Atlas v5</text>
<text x="40" y="69" class="sub">Illustrative design only. Detailed anatomy for orientation; normal/reference and tumor tissue are rendered separately.</text>

<g transform="translate(28,94)">
  <rect class="panel" x="0" y="0" width="690" height="840" rx="18"/>
  <text x="24" y="38" class="h2">Detailed body orientation + reference tissue ring</text>
  <text x="24" y="60" class="sub">Tumor-resolved spatial data no longer contributes to this whole-body reference view.</text>

