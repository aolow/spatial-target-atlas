      <g fill="#fff" stroke="#64748b"><circle cx="271" cy="237" r="11"/><circle cx="316" cy="286" r="11"/><circle cx="360" cy="242" r="11"/><circle cx="366" cy="326" r="11"/></g>
      <g fill="#bfdbfe" stroke="#2563eb"><circle cx="271" cy="237" r="7"/><circle cx="316" cy="286" r="7"/><circle cx="360" cy="242" r="7"/><circle cx="366" cy="326" r="7"/></g>
      <text x="35" y="152" class="scene-label">irregular tumor nests</text><text x="280" y="61" class="scene-label">abnormal vessel</text><text x="280" y="213" class="scene-label">immune infiltrate</text><text x="26" y="392" class="scene-label">desmoplastic stroma</text>
    </g>
    <rect x="18" y="518" width="389" height="49" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="30" y="538" class="small" font-weight="700">Paired bulk tumor evidence stays separate</text>
    <text x="30" y="555" class="small">not assigned to epithelial / stroma / immune compartments</text>
  </g>

  <g transform="translate(24,713)">
    <text x="0" y="0" class="h2">Subcellular view remains a third scale</text>
    <circle cx="80" cy="67" r="54" fill="#f8fafc" stroke="#d1d5db" stroke-dasharray="5 5"/>
    <circle cx="80" cy="67" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <circle cx="80" cy="67" r="17" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="151" y="54" class="small">body / tissue / cell compartment / subcellular</text>
    <text x="151" y="74" class="small">kept conceptually separate rather than collapsed into one view</text>
  </g>
