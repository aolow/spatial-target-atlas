    </g>
    <text x="260" y="615" text-anchor="middle" class="small">airway · vessels · lymphatics · organ scaffold</text>
  </g>

  <g transform="translate(42,730)">
    <rect x="0" y="0" width="15" height="15" rx="3" fill="#00b7d8"/><text x="23" y="12" class="small">Human Protein Atlas protein</text>
    <rect x="205" y="0" width="15" height="15" rx="3" fill="#d946ef"/><text x="228" y="12" class="small">ProteomicsDB protein</text>
    <rect x="426" y="0" width="15" height="15" rx="3" fill="#facc15"/><text x="449" y="12" class="small">Spatial RNA</text>
