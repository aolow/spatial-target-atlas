[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-target-atlas"
version = "0.5.2"
description = "Integrate multimodal target evidence across tissues, cells, and spatial datasets."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aleksandra Olow"}]
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
cli = [
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pyyaml>=6,<7",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
    "typer>=0.12,<1",
    "types-PyYAML>=6,<7",
]
spatial = [
    "cellxgene-census>=1.18.0",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[project.scripts]
spatial-target-atlas = "spatial_target_atlas.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_target_atlas"]

[tool.pytest.ini_options]
addopts = "--cov=spatial_target_atlas --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spatial_target_atlas"]
