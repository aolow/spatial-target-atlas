[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-target-atlas"
version = "0.1.0"
description = "Map measured and model-derived target evidence across tissues, cells, and space."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aleksandra Olow"}]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "pyyaml>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8,<10", "pytest-cov>=5,<8", "respx>=0.21,<1", "ruff>=0.6,<1", "types-PyYAML>=6,<7"]

[project.scripts]
spatial-target-atlas = "spatial_target_atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_target_atlas"]

[tool.pytest.ini_options]
addopts = "--cov=spatial_target_atlas --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spatial_target_atlas"]
